[project]
name = "ui-agent"
version = "0.1.0"
description = "Prompt -> explored, refined, handoff-ready web page UI"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.13",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "aiosqlite",
  "pydantic>=2.10",
  "fastapi>=0.115",
  "uvicorn[standard]",
  "playwright>=1.50",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
